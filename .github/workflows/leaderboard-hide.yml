name: Leaderboard - hide a nickname

# Run by hand to take a nickname off the leaderboards (rude name, cheating). It stays hidden even if the
# phone keeps syncing. Use "unhide" to bring it back.
on:
  workflow_dispatch:
    inputs:
      nick:
        description: "Nickname exactly as shown"
        required: true
      action:
        description: "hide or unhide"
        default: "hide"

permissions:
  contents: read

jobs:
  hide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      NICK: ${{ github.event.inputs.nick }}
      ACTION: ${{ github.event.inputs.action }}
    defaults:
      run:
        working-directory: ratings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update
        run: |
          KEY=$(python3 -c "import os,re; print(re.sub(r'[^a-z0-9]','',os.environ['NICK'].lower()))")
          [ -n "$KEY" ] || { echo "empty nickname"; exit 1; }
          VAL=$([ "$ACTION" = "unhide" ] && echo 0 || echo 1)
          ID=$(npx -y wrangler@4 d1 list --json | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((x.get('uuid') or x.get('id') for x in d if x.get('name')=='knewdle-ratings'),''))")
          sed "s/__DATABASE_ID__/$ID/" wrangler.template.toml > wrangler.toml
          npx -y wrangler@4 d1 execute knewdle-ratings --remote --command "UPDATE lb_players SET hidden = $VAL WHERE nick_norm = '$KEY'"
          npx -y wrangler@4 d1 execute knewdle-ratings --remote --command "SELECT nick, hidden FROM lb_players WHERE nick_norm = '$KEY'"

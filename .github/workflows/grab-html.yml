name: Grab pages (debug)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "space-separated URLs"
        required: true
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          mkdir -p state/grab
          python - <<'PY'
          import os, re
          from menucheck.crawl import Crawler
          c = Crawler("https://github.com/SWATSrocks/knewdle-data")
          for u in os.environ["URLS"].split():
              r = c.fetch(u)
              name = re.sub(r"[^a-z0-9]+", "_", u.lower())[:80]
              open(f"state/grab/{name}.html", "wb").write(r.content if r is not None else b"NONE")
              print(u, None if r is None else len(r.content))
          PY
      - run: |
          git config user.name "knewdle-menu-check"
          git config user.email "actions@users.noreply.github.com"
          git add state/grab
          git commit -m "debug pages" && git pull --rebase -X theirs origin main && git push

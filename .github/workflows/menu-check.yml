name: Menu check

# Weekly; each run only re-reads websites that are due (ramen places monthly, others every few months),
# so after the first few runs it settles into a light monthly rhythm.
on:
  schedule:
    - cron: "23 7 * * 1"     # Mondays 07:23 UTC
  workflow_dispatch:
    inputs:
      max_sites:
        description: "Max websites to read this run"
        default: "25000"
      focus:
        description: "Optional 'lat,lon' to check nearby places first (e.g. 35.23,-80.84 for Charlotte)"
        default: ""
      steps:
        description: "What to run: all, more (only names/chains/new websites), or menus"
        default: "all"
      more_args:
        description: "Testing only: extra options for the 'more' step (e.g. --skip names,chains)"
        default: ""

permissions:
  contents: write

concurrency:
  group: menu-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe free sources (testing)
        if: ${{ github.event.inputs.steps == 'probe' }}
        timeout-minutes: 30
        continue-on-error: true
        run: python -u -m menucheck.probe 2>&1 | tee state/probe_log.txt
      - name: Find more ramen (names, chains, new websites)
        if: ${{ github.event.inputs.steps != 'menus' && github.event.inputs.steps != 'probe' }}
        timeout-minutes: 75
        continue-on-error: true
        # The log is saved with the results (state/discover_log.txt) so problems can be looked into later.
        run: |
          set -o pipefail
          python -u -m menucheck.discover ${{ github.event.inputs.more_args || '' }} 2>&1 | tee state/discover_log.txt
      - name: Check menus
        if: ${{ github.event.inputs.steps != 'more' && github.event.inputs.steps != 'probe' }}
        # Stops in time for the results to be saved below, even on a very long run.
        timeout-minutes: 270
        continue-on-error: true
        run: python -m menucheck.run --max-sites "${{ github.event.inputs.max_sites || '25000' }}" --focus "${{ github.event.inputs.focus || '' }}"
      - name: Publish results
        if: always()
        run: |
          git config user.name "knewdle-menu-check"
          git config user.email "actions@users.noreply.github.com"
          git add state docs
          git diff --cached --quiet || git commit -m "Menu check $(date -u +%Y-%m-%d)"
          # If anything else was pushed while this ran, keep this run's results on top of it.
          git pull --rebase -X theirs origin main || true
          git push

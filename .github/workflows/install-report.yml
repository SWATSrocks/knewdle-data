# Read-only: install totals by country and source for the last 30 days (no device IDs). Run by hand.
name: Install report
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ratings
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Totals
        run: |
          q() { echo "== $1"; npx -y wrangler@4 d1 execute knewdle-ratings --remote --json --command "$2" | python3 -c "
          import sys,json
          for r in json.load(sys.stdin)[0]['results']: print('  ' + ' | '.join(str(v) for v in r.values()))"; }
          SINCE="(strftime('%s','now','-30 days')*1000)"
          q "By country, last 30 days" "SELECT COALESCE(country,'?') AS c, COUNT(*) AS n FROM installs WHERE ts >= $SINCE AND device NOT LIKE 'smoke-test-device%' GROUP BY c ORDER BY n DESC LIMIT 40"
          q "By source, last 30 days" "SELECT src, medium, COUNT(*) AS n FROM installs WHERE ts >= $SINCE AND device NOT LIKE 'smoke-test-device%' GROUP BY src, medium ORDER BY n DESC"
          q "US vs not-US by source, last 30 days" "SELECT CASE WHEN country='US' THEN 'US' ELSE 'not US' END AS where_, src, medium, COUNT(*) AS n FROM installs WHERE ts >= $SINCE AND device NOT LIKE 'smoke-test-device%' GROUP BY where_, src, medium ORDER BY where_, n DESC"
          q "Installer (store), last 30 days" "SELECT COALESCE(installer,'?') AS installer, CASE WHEN country='US' THEN 'US' ELSE 'not US' END AS where_, COUNT(*) AS n FROM installs WHERE ts >= $SINCE AND device NOT LIKE 'smoke-test-device%' GROUP BY installer, where_ ORDER BY n DESC"
          q "Not-US by week" "SELECT strftime('%Y-%W', ts/1000, 'unixepoch') AS wk, SUM(country='US') AS us, SUM(COALESCE(country,'')<>'US') AS not_us FROM installs WHERE ts >= (strftime('%s','now','-60 days')*1000) AND device NOT LIKE 'smoke-test-device%' GROUP BY wk ORDER BY wk"

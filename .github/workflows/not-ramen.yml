name: Hide not-ramen places

# A line added to not_ramen.txt takes effect right away (the app picks it up on its next data refresh, within 6 hours).
on:
  push:
    branches: [main]
    paths: [not_ramen.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  hide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Remove listed places and rebuild the city pages
        run: python -u -m menucheck.hide
      - name: Publish
        # If another data job saved the same files first, start again from the latest copy,
        # redo this job's changes on top of it, and try again, instead of failing.
        run: |
          git config user.name "knewdle-bot"
          git config user.email "knewdle-bot@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git add docs/menu_ramen.json docs/ramen docs/app docs/llms.txt docs/sitemap.xml
            git diff --cached --quiet && { echo "nothing to change"; exit 0; }
            git commit -q -m "Hide not-ramen places"
            if git pull --rebase -q origin main && git push -q; then echo "published (try $attempt)"; exit 0; fi
            echo "Another job saved first; redoing on top of the latest copy (try $attempt)"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            sleep $((attempt * 10))
            python -u -m menucheck.hide
          done
          echo "Still colliding after 4 tries; the next run will catch up."
          exit 1

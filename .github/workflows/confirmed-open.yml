name: Developer shop lists (still open / pulled down)

# "Still open" taps in Knewdle Pulse take the "may be closed" warning off within ~30 minutes
# (phones pick it up on their next data refresh, within 6 hours). The daily Shop updates run applies them too.
on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths: [address_fixes.txt, shop_details.txt, hours_by_hand.txt, osm_hours.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Drop warnings about confirmed-open shops
        run: python -u -m menucheck.confirmed
      - name: Publish
        # If another data job saved the same files first, start again from the latest copy,
        # redo this job's changes on top of it, and try again, instead of failing.
        run: |
          git config user.name "knewdle-bot"
          git config user.email "knewdle-bot@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git add -f state/geocoded.json 2>/dev/null; git add docs/closed.json docs/menu_ramen.json docs/hours.json docs/osm_ramen.json docs/ramen docs/app docs/llms.txt docs/sitemap.xml
            git diff --cached --quiet && { echo "nothing to change"; exit 0; }
            git commit -q -m "Confirmed-open shops"
            if git pull --rebase -q origin main && git push -q; then echo "published (try $attempt)"; exit 0; fi
            echo "Another job saved first; redoing on top of the latest copy (try $attempt)"
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            sleep $((attempt * 10))
            python -u -m menucheck.confirmed
          done
          echo "Still colliding after 4 tries; the next run will catch up."
          exit 1

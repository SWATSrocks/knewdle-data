name: Confirmed-open shops

# "Still open" taps in Knewdle Pulse take the "may be closed" warning off within ~30 minutes
# (phones pick it up on their next data refresh, within 6 hours). The daily Shop updates run applies them too.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Drop warnings about confirmed-open shops
        run: python -u -m menucheck.confirmed
      - name: Publish
        run: |
          git config user.name "knewdle-bot"
          git config user.email "knewdle-bot@users.noreply.github.com"
          git add docs/closed.json
          git diff --cached --quiet && { echo "nothing to change"; exit 0; }
          git commit -m "Confirmed-open shops"
          git pull --rebase origin main
          git push

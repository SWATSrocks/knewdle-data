name: Ramen styles

# Reads ramen shops' own website menus to learn which styles they serve (tonkotsu, miso, tsukemen…),
# for the app's Knewdle Knowledge "Try it near you". Weekly; each site is re-read every 30 days.
on:
  schedule:
    - cron: "41 9 * * 3"     # Wednesdays 09:41 UTC
  workflow_dispatch:
    inputs:
      max_sites:
        description: "Max websites to read this run"
        default: "6000"
      focus:
        description: "Optional 'lat,lon' to read nearby shops first"
        default: ""

permissions:
  contents: write

concurrency:
  group: ramen-styles
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read menus
        run: python -u -m menucheck.styles --max-sites "${{ github.event.inputs.max_sites || '6000' }}" --focus "${{ github.event.inputs.focus }}"
      - name: Publish
        run: |
          git config user.name "knewdle-bot"
          git config user.email "knewdle-bot@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git add docs/styles.json state/styles_state.json
            git diff --cached --quiet && { echo "nothing to change"; exit 0; }
            git commit -q -m "Ramen styles"
            if git pull --rebase -q origin main && git push -q; then echo "published (try $attempt)"; exit 0; fi
            echo "Another job saved first; retrying on the latest copy (try $attempt)"
            git rebase --abort 2>/dev/null || true
            cp docs/styles.json /tmp/styles.json; cp state/styles_state.json /tmp/styles_state.json
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/styles.json docs/styles.json; cp /tmp/styles_state.json state/styles_state.json
            sleep $((attempt * 10))
          done
          exit 1

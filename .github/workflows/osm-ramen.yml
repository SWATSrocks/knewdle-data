name: OpenStreetMap ramen

# Daily: one patient request to OpenStreetMap's Overpass for every US ramen place, published as docs/osm_ramen.json
# (the app downloads this instead of asking busy Overpass servers from every phone). Runs before "Shop updates",
# which then checks these shops' websites for hours and closures too.
on:
  schedule:
    - cron: "41 8 * * *"      # every day 8:41 UTC (4:41am Eastern)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osm-ramen
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch
        run: python -u -m menucheck.osm
      - name: Publish
        run: |
          git config user.name "knewdle-menu-check"
          git config user.email "actions@users.noreply.github.com"
          git add docs/osm_ramen.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "OpenStreetMap ramen $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main || true
          git push
